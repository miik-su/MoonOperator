name: Focused Kind acceptance
on:
  push:
  workflow_dispatch:
    inputs:
      export-candidate:
        description: Export the scanned Linux amd64 image and matching build sources
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  moonapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: v1.37.0
            node: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          - kubernetes: v1.36.4
            node: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          - kubernetes: v1.35.8
            node: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-moonbit
        with:
          scalar-utf: 'true'
      - run: moon build cmd/moonapp cmd/manifests cmd/diagnostic_probe tests/cluster_client tests/memory_profile --target native --release
      - name: Build the production image
        id: production
        env:
          EXPORT_CANDIDATE: ${{ inputs.export-candidate }}
        run: |
          target=production
          build_args=()
          if [ "$EXPORT_CANDIDATE" = true ]; then
            target=distribution
            build_args=(--build-arg "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)")
          fi
          docker build "${build_args[@]}" --target "$target" -t moonoperator:dev .
          docker image inspect moonoperator:dev | jq -e '.[0] | (.RootFS.Layers | length == 1) and (.Config.User == "65532:65532") and (.Config.Entrypoint == ["/usr/local/bin/moonoperator"])'
      - run: docker build --target acceptance -t moonoperator-probe:dev .
      - name: Verify the image filesystem and distributed notices
        env:
          EXPORT_CANDIDATE: ${{ inputs.export-candidate }}
        run: |
          image=$(docker create moonoperator:dev)
          trap 'docker rm "$image" >/dev/null' EXIT
          docker export "$image" | tar -tf - > image-files.txt
          if grep -Eq '(^|/)client-probe$' image-files.txt; then exit 1; fi
          docker cp "$image:/usr/share/moonoperator-runtime-packages.txt" runtime-packages.txt
          docker cp "$image:/usr/share/doc/moonoperator" image-notices
          for file in LICENSE NOTICE LICENSING.md THIRD_PARTY_NOTICES.md; do
            cmp "$file" "image-notices/$file"
          done
          diff -r third_party image-notices/third_party
          if [ "$EXPORT_CANDIDATE" = true ]; then
            if grep -Eq '(^|/)(os-release|lsb-release|dpkg-query|bash|apt-get)$' image-files.txt; then exit 1; fi
            mkdir distribution-evidence
            docker cp "$image:/usr/local/bin/moonoperator" distribution-evidence/moonoperator
            docker cp "$image:/usr/share/doc/moonoperator/binary-source-packages.tsv" distribution-evidence/binary-source-packages.tsv
            (cd distribution-evidence && sha256sum moonoperator > moonoperator-sha256.txt && rm moonoperator)
            for file in libc6 libssl3t64 ca-certificates; do
              docker cp "$image:/usr/share/doc/$file/copyright" "distribution-evidence/$file-copyright"
              test -s "distribution-evidence/$file-copyright"
            done
            sort image-files.txt > distribution-evidence/image-files.txt
            docker run --rm --read-only --network none --entrypoint /lib64/ld-linux-x86-64.so.2 moonoperator:dev --list /usr/local/bin/moonoperator > distribution-evidence/loader.txt
          fi
      - name: Capture the intermediate base package versions
        if: matrix.kubernetes == 'v1.37.0' && !inputs.export-candidate
        run: docker build --target base -t moonoperator-base:audit .
      - name: Retain package sources, copyrights and native linkage
        if: matrix.kubernetes == 'v1.37.0' && !inputs.export-candidate
        run: moon run scripts/distribution-inventory.mbtx -- distribution-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && matrix.kubernetes == 'v1.37.0' }}
        with:
          name: runtime-distribution-inventory
          path: distribution-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Download pinned Kind release
        run: |
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind || curl --retry 2 --connect-timeout 20 --max-time 120 -fsSL -H 'Accept: application/octet-stream' https://api.github.com/repos/kubernetes-sigs/kind/releases/assets/531396433 -o /tmp/kind
      - run: sha256sum --check tools/kind-linux.sha256
      - run: chmod +x /tmp/kind
      - name: Create disposable Kind cluster from the pinned node image
        env:
          KIND_NODE_IMAGE: ${{ matrix.node }}
        run: /tmp/kind create cluster --name moonoperator-e2e --config config/kind-calico.yaml --image "$KIND_NODE_IMAGE" --wait 120s
      - name: Install checksum-verified Calico for policy enforcement
        run: |
          curl --retry 3 --retry-all-errors --max-time 120 -fsSL https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml -o /tmp/calico.yaml
          sha256sum --check tools/calico.sha256
          kubectl --context kind-moonoperator-e2e apply --server-side -f /tmp/calico.yaml
          kubectl --context kind-moonoperator-e2e -n kube-system rollout status daemonset/calico-node --timeout=240s
          kubectl --context kind-moonoperator-e2e wait --for=condition=Ready nodes --all --timeout=180s
      - name: Verify the Kubernetes server version
        env:
          EXPECTED_KUBERNETES_VERSION: ${{ matrix.kubernetes }}
        run: |
          kubectl --context kind-moonoperator-e2e version -o json > kind-version.json
          jq -e --arg version "$EXPECTED_KUBERNETES_VERSION" '.serverVersion.gitVersion == $version' kind-version.json
      - run: /tmp/kind load docker-image moonoperator:dev moonoperator-probe:dev --name moonoperator-e2e
      - run: moon run scripts/kind-e2e.mbtx -- _build/native/release/build/cmd/manifests/manifests.exe
      - run: moon run scripts/network-policy.mbtx
      - name: Display cluster acceptance results
        if: always()
        run: moon run scripts/report-summary.mbtx -- kind '${{ job.status }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kind-acceptance-${{ matrix.kubernetes }}
          path: |
            kind-e2e-report.json
            cluster-client-report.json
            kind-version.json
            runtime-packages.txt
            test-results-summary.md
            network-policy-report.json
            rbac-report.json
            adoption-report.json
          if-no-files-found: ignore
      - run: kubectl --context kind-moonoperator-e2e -n moonoperator-e2e logs deployment/moonoperator
        if: failure()
      - run: kubectl --context kind-moonoperator-e2e -n moonoperator-e2e logs pod/client-probe
        if: failure()
      - run: /tmp/kind delete cluster --name moonoperator-e2e
        if: always()

      - name: Scan installed OS packages with pinned Trivy
        if: ${{ !cancelled() && steps.production.outcome == 'success' && matrix.kubernetes == 'v1.37.0' }}
        env:
          EXPORT_CANDIDATE: ${{ inputs.export-candidate }}
        run: |
          curl --retry 2 --retry-all-errors --connect-timeout 15 --max-time 90 -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o /tmp/trivy-linux.tar.gz || curl --retry 2 --connect-timeout 15 --max-time 90 -fsSL -H 'Accept: application/octet-stream' https://api.github.com/repos/aquasecurity/trivy/releases/assets/713401165 -o /tmp/trivy-linux.tar.gz
          sha256sum --check tools/trivy-linux.sha256
          tar -xzf /tmp/trivy-linux.tar.gz -C /tmp trivy
          mkdir -p os-scan
          git rev-parse HEAD > os-scan/source-commit.txt
          image_id=$(docker image inspect --format '{{.Id}}' moonoperator:dev)
          printf '%s\n' "$image_id" > os-scan/image-id.txt
          distro=()
          if [ "$EXPORT_CANDIDATE" = true ]; then distro=(--distro ubuntu/24.04); fi
          /tmp/trivy --cache-dir /tmp/moonoperator-trivy image --timeout 4m --image-src docker --scanners vuln --pkg-types os "${distro[@]}" --list-all-pkgs --format json --output os-scan/trivy.json "$image_id"
          /tmp/trivy --cache-dir /tmp/moonoperator-trivy --version > os-scan/trivy-version.txt
          jq -e '[.Results[] | select(.Class == "os-pkgs") | .Packages[]] | length > 0' os-scan/trivy.json
          if [ "$EXPORT_CANDIDATE" = true ]; then
            jq -e '[.Results[] | select(.Class == "os-pkgs") | .Packages[].Name] | sort == ["ca-certificates","libc6","libssl3t64"]' os-scan/trivy.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && matrix.kubernetes == 'v1.37.0' }}
        with:
          name: os-vulnerability-observations
          path: os-scan/
          if-no-files-found: warn
          retention-days: 30

      - name: Run bounded memory probes
        id: memory
        if: ${{ !cancelled() && steps.production.outcome == 'success' && matrix.kubernetes == 'v1.37.0' }}
        run: moon run scripts/memory-evidence.mbtx
      - name: Display memory observations
        if: ${{ !cancelled() && steps.memory.outcome != 'skipped' && matrix.kubernetes == 'v1.37.0' }}
        run: moon run scripts/report-summary.mbtx -- memory '${{ steps.memory.outcome }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.memory.outcome != 'skipped' && matrix.kubernetes == 'v1.37.0' }}
        with:
          name: memory-observations
          path: |
            memory-evidence-report.json
            test-results-summary.md
          if-no-files-found: warn

      - name: Export the tested Linux amd64 image and build sources
        if: matrix.kubernetes == 'v1.37.0' && inputs.export-candidate
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' moon.mod)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="moonoperator:$version"
          prefix="moonoperator-v$version-linux-amd64"
          output="$RUNNER_TEMP/release-candidate"
          mkdir -p "$output" "$RUNNER_TEMP/release-source/moonbit-sdk"
          source_root="$RUNNER_TEMP/release-source"
          image_id=$(cat os-scan/image-id.txt)
          docker image inspect "$image_id" | jq -e '.[0] | .Os == "linux" and .Architecture == "amd64"'
          docker tag "$image_id" "$tag"
          docker save "$tag" | gzip -n > "$output/$prefix-image.tar.gz"
          # Exercise the recorded archive, including the image configuration digest.
          docker image rm "$tag" moonoperator:dev
          docker load -i "$output/$prefix-image.tar.gz"
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$image_id"
          git archive --format=tar.gz --prefix=MoonOperator/ HEAD > "$source_root/project.tar.gz"
          cp -R "$MOON_TOOLCHAIN_ROOT/lib/runtime" "$MOON_TOOLCHAIN_ROOT/include" "$MOON_TOOLCHAIN_ROOT/CREDITS.md" "$source_root/moonbit-sdk/"
          cp /tmp/core.tar.gz "$source_root/moonbit-core.tar.gz"
          mkdir -p "$source_root/mooncakes/moonbitlang" "$source_root/mooncakes/moonbit-community"
          cp -R .mooncakes/moonbitlang/async "$source_root/mooncakes/moonbitlang/"
          cp -R .mooncakes/moonbit-community/yaml "$source_root/mooncakes/moonbit-community/"
          mkdir -p "$source_root/generated-native"
          (cd _build/native/release/build && find . -type f -name '*.c' -exec cp --parents '{}' "$source_root/generated-native/" \;)
          test -n "$(find "$source_root/generated-native/cmd/moonapp" -type f -name '*.c' -print -quit)"
          tar -czf "$output/moonoperator-v$version-project-runtime-sources.tar.gz" -C "$source_root" .
          cp distribution-evidence/* "$output/"
          cp os-scan/image-id.txt os-scan/source-commit.txt os-scan/trivy-version.txt "$output/"
          (cd "$output" && sha256sum *.tar.gz > candidate-SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.kubernetes == 'v1.37.0' && inputs.export-candidate
        with:
          name: linux-amd64-release-candidate
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 7

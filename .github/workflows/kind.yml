name: Focused Kind acceptance
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-moonbit
      - run: moon build cmd/moonapp cmd/manifests cmd/diagnostic_probe tests/cluster_client tests/memory_profile --target native --release
      - run: docker build --target production -t moonoperator:dev .
      - run: docker build --target acceptance -t moonoperator-probe:dev .
      - run: docker run --rm --entrypoint /usr/bin/test moonoperator:dev ! -e /usr/local/bin/client-probe
      - name: Verify distributed license files
        run: |
          docker run --rm --entrypoint /usr/bin/test moonoperator:dev -s /usr/share/doc/moonoperator/LICENSE
          docker run --rm --entrypoint /usr/bin/test moonoperator:dev -s /usr/share/doc/moonoperator/NOTICE
          docker run --rm --entrypoint /usr/bin/test moonoperator:dev -s /usr/share/doc/moonoperator/THIRD_PARTY_NOTICES.md
          docker run --rm --entrypoint /usr/bin/test moonoperator:dev -s /usr/share/doc/moonoperator/third_party/yaml-LICENSE
          docker run --rm --entrypoint /usr/bin/test moonoperator:dev -s /usr/share/doc/moonoperator/third_party/async-LICENSE
          docker run --rm --entrypoint /usr/bin/test moonoperator:dev -s /usr/share/doc/moonoperator/third_party/moonbit-core-LICENSE
      - run: docker run --rm --entrypoint /usr/bin/cat moonoperator:dev /usr/share/moonoperator-runtime-packages.txt > runtime-packages.txt
      - run: docker save moonoperator:dev moonoperator-probe:dev -o moonoperator-images.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moonoperator-test-images
          path: |
            moonoperator-images.tar
            runtime-packages.txt
          retention-days: 1

  moonapp:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-moonbit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: moonoperator-test-images
      - run: docker load -i moonoperator-images.tar
      - run: moon build cmd/manifests --target native --release
      - name: Download pinned Kind release
        run: |
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind || curl --retry 2 --connect-timeout 20 --max-time 120 -fsSL -H 'Accept: application/octet-stream' https://api.github.com/repos/kubernetes-sigs/kind/releases/assets/531396433 -o /tmp/kind
      - run: sha256sum --check tools/kind-linux.sha256
      - run: chmod +x /tmp/kind
      - run: /tmp/kind create cluster --name moonoperator-e2e --config config/kind-calico.yaml --wait 120s
      - name: Install checksum-verified Calico for policy enforcement
        run: |
          curl --retry 3 --retry-all-errors --max-time 120 -fsSL https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/calico.yaml -o /tmp/calico.yaml
          sha256sum --check tools/calico.sha256
          kubectl --context kind-moonoperator-e2e apply --server-side -f /tmp/calico.yaml
          kubectl --context kind-moonoperator-e2e -n kube-system rollout status daemonset/calico-node --timeout=240s
          kubectl --context kind-moonoperator-e2e wait --for=condition=Ready nodes --all --timeout=180s
      - run: kubectl --context kind-moonoperator-e2e version -o json > kind-version.json
      - run: /tmp/kind load docker-image moonoperator:dev moonoperator-probe:dev --name moonoperator-e2e
      - run: moon run scripts/kind-e2e.mbtx -- _build/native/release/build/cmd/manifests/manifests.exe
      - run: moon run scripts/network-policy.mbtx
      - name: Display cluster acceptance results
        if: always()
        run: moon run scripts/report-summary.mbtx -- kind '${{ job.status }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kind-acceptance
          path: |
            kind-e2e-report.json
            cluster-client-report.json
            kind-version.json
            runtime-packages.txt
            test-results-summary.md
            network-policy-report.json
            rbac-report.json
            adoption-report.json
          if-no-files-found: ignore
      - run: kubectl --context kind-moonoperator-e2e -n moonoperator-e2e logs deployment/moonoperator
        if: failure()
      - run: kubectl --context kind-moonoperator-e2e -n moonoperator-e2e logs pod/client-probe
        if: failure()
      - run: /tmp/kind delete cluster --name moonoperator-e2e
        if: always()

  memory:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-moonbit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: moonoperator-test-images
      - run: docker load -i moonoperator-images.tar
      - run: moon run scripts/memory-evidence.mbtx
      - name: Display memory observations
        if: always()
        run: moon run scripts/report-summary.mbtx -- memory '${{ job.status }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: memory-observations
          path: |
            memory-evidence-report.json
            test-results-summary.md
          if-no-files-found: warn

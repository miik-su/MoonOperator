apiVersion: apps/v1
kind: Deployment
metadata:
  name: moonoperator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moonoperator
  template:
    metadata:
      labels:
        app: moonoperator
    spec:
      serviceAccountName: moonoperator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: moonoperator:dev
          imagePullPolicy: Never
          env:
            - name: MOONOPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi

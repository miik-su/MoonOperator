name: Published release acceptance
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Public reproducible release tag (vMAJOR.MINOR.PATCH)
        type: string
        required: true
permissions:
  contents: read
jobs:
  clean-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: .acceptance-harness
      - name: Verify all public release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          release="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          asset_prefix="moonoperator-$RELEASE_TAG"
          mkdir "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/report" "$RUNNER_TEMP/source" "$RUNNER_TEMP/system"
          cd "$RUNNER_TEMP/downloads"
          curl --retry 3 --retry-all-errors --max-time 60 -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/$RELEASE_TAG" -o github-release.json
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false' github-release.json
          source_sha=$(curl --retry 3 --retry-all-errors --max-time 60 -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/commits/$RELEASE_TAG" | jq -er '.sha | select(test("^[a-f0-9]{40}$"))')
          for asset in SHA256SUMS release-manifest.json "$asset_prefix"-{linux-amd64-image.tar.gz,project-runtime-sources.tar.gz,linux-amd64-system-sources.tar}; do
            digest=$(jq -er --arg asset "$asset" '[.assets[] | select(.name == $asset and .state == "uploaded") | .digest] | select(length == 1) | .[0] | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' github-release.json)
            curl --retry 3 --retry-all-errors --max-time 120 -fsSLO "$release/$asset"
            printf '%s  %s\n' "${digest#sha256:}" "$asset" >> "$RUNNER_TEMP/report/public-asset-digests.txt"
          done
          sha256sum --check --strict "$RUNNER_TEMP/report/public-asset-digests.txt" | tee "$RUNNER_TEMP/report/downloads.txt"
          diff -u <(tail -n +2 "$RUNNER_TEMP/report/public-asset-digests.txt" | LC_ALL=C sort) <(LC_ALL=C sort SHA256SUMS)
          sha256sum --check --strict SHA256SUMS
          cp SHA256SUMS "$RUNNER_TEMP/report/"
          jq -e --arg sha "$source_sha" --arg version "$version" '
            .source_commit == $sha and .version == $version and .platform == "linux/amd64" and
            (.source_date_epoch | type == "number" and . >= 0 and floor == .) and
            (.filesystem_layers | type == "array" and length == 1)
          ' release-manifest.json
          {
            echo "SOURCE_SHA=$source_sha"
            echo "RELEASE_VERSION=$version"
          } >> "$GITHUB_ENV"
          tar -xzf "$asset_prefix-project-runtime-sources.tar.gz" -C "$RUNNER_TEMP/source"
          tar -xf "$asset_prefix-linux-amd64-system-sources.tar" -C "$RUNNER_TEMP/system"
      - name: Verify the signed source index and unpack corresponding sources
        working-directory: ${{ runner.temp }}/system
        run: |
          gpgv --status-fd 1 --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg --output "$RUNNER_TEMP/Release" archive-auth/noble-security.InRelease | tee "$RUNNER_TEMP/report/archive-signature.txt"
          grep -q 'VALIDSIG F6ECB3762474EDA9D21B7022871920D1991BC93C ' "$RUNNER_TEMP/report/archive-signature.txt"
          expected=$(awk 'length($1) == 64 && $3 == "main/source/Sources.xz" {print $1}' "$RUNNER_TEMP/Release")
          printf '%s  archive-auth/noble-security.Sources.xz\n' "$expected" | sha256sum --check --strict
          xz -dc archive-auth/noble-security.Sources.xz > "$RUNNER_TEMP/Sources"
          jq -r '.source_packages[] | .source as $name | .files[] | "\(.sha256)  \($name)/\(.file)"' source-manifest.json |
            sha256sum --check --strict - | tee "$RUNNER_TEMP/report/system-files.txt"
          mkdir "$RUNNER_TEMP/unpacked"
          for name in ca-certificates gcc-13 glibc openssl; do
            dsc=("$name"/*.dsc)
            test "${#dsc[@]}" = 1
            awk -v name="$name" -v version="$(jq -er --arg name "$name" '.source_packages[] | select(.source == $name) | .version' source-manifest.json)" '
              BEGIN { RS=""; FS="\n" }
              $0 ~ ("(^|\n)Package: " name "(\n|$)") {
                for (i=1; i<=NF; i++) if ($i == "Version: " version) { print; found=1; exit }
              }
              END { if (!found) exit 1 }
            ' "$RUNNER_TEMP/Sources" > "$RUNNER_TEMP/$name.index"
            while IFS= read -r file; do
              hash=$(sha256sum "$name/$file" | cut -d ' ' -f 1)
              grep -Fx " $hash $(stat -c %s "$name/$file") $file" "$RUNNER_TEMP/$name.index"
            done < <(jq -er --arg name "$name" '.source_packages[] | select(.source == $name) | .files[].file' source-manifest.json)
            dpkg-source -x "${dsc[0]}" "$RUNNER_TEMP/unpacked/$name" > "$RUNNER_TEMP/$name.log" 2>&1 || { tail -40 "$RUNNER_TEMP/$name.log"; exit 1; }
            printf '%s: unpacked\n' "$name" | tee -a "$RUNNER_TEMP/report/system-unpack.txt"
          done
      - name: Rebuild from extracted MoonBit sources
        working-directory: ${{ runner.temp }}/source
        run: |
          gzip -dk project.tar.gz
          test "$(git get-tar-commit-id < project.tar)" = "$SOURCE_SHA"
          # MoonBit emits absolute source paths. Use the release build directory
          # to compare the executable without introducing a different prefix.
          test ! -e "$GITHUB_WORKSPACE/moon.mod"
          tar -xf project.tar
          cp -a MoonOperator/. "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          test ! -e _build
          test ! -e .mooncakes
          archive="$RUNNER_TEMP/source"
          cp -a "$archive/mooncakes" .mooncakes
          curl --retry 3 --retry-all-errors --max-time 120 -fsSL 'https://cli.moonbitlang.com/binaries/0.10.17%2Bd971670cd/moonbit-linux-x86_64.tar.gz' -o /tmp/moonbit.tar.gz
          cp "$archive/moonbit-core.tar.gz" /tmp/core.tar.gz
          sha256sum --check tools/moonbit-linux.sha256
          sdk="$RUNNER_TEMP/moonoperator-scalar-sdk"
          mkdir -p "$sdk/lib"
          tar --exclude=./lib/simdutf.o --exclude=./lib/moonbit_simdutf.o -xzf /tmp/moonbit.tar.gz -C "$sdk"
          tar -xzf /tmp/core.tar.gz -C "$sdk/lib"
          diff -r "$archive/moonbit-sdk/runtime" "$sdk/lib/runtime"
          diff -r "$archive/moonbit-sdk/include" "$sdk/include"
          chmod +x "$sdk/bin/"* "$sdk/bin/internal/tcc"
          export PATH="$sdk/bin:$PATH" MOON_TOOLCHAIN_ROOT="$sdk" MOONBIT_ALLOCATOR=system
          moon -C "$sdk/lib/core" bundle --frozen --all
          moon version --all | tee "$RUNNER_TEMP/report/toolchain.txt"
          gcc -dumpfullversion | tee "$RUNNER_TEMP/report/gcc-version.txt"
          dpkg-query -W -f='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' gcc-13 libc6-dev libgcc-13-dev | tee "$RUNNER_TEMP/report/builder-packages.tsv"
          while IFS=$'\t' read -r binary version source source_version; do
            jq -e --arg src "$source" --arg ver "$source_version" 'any(.source_packages[]; .source == $src and .version == $ver)' "$RUNNER_TEMP/system/source-manifest.json"
          done < "$RUNNER_TEMP/report/builder-packages.tsv"
          # Frozen builds still need a registry index. Package sources are local.
          moon update
          moon build --frozen cmd/moonapp cmd/manifests --target native --release
          diff -r --exclude=.moon-lock "$archive/mooncakes" .mooncakes
          sha256sum "$archive/generated-native/cmd/moonapp/moonapp.c" _build/native/release/build/cmd/moonapp/moonapp.c | tee "$RUNNER_TEMP/report/generated-c.txt"
          sha256sum _build/native/release/build/cmd/moonapp/moonapp.exe | tee "$RUNNER_TEMP/report/rebuilt-binary.txt"
          epoch=$(jq -er .source_date_epoch "$RUNNER_TEMP/downloads/release-manifest.json")
          docker build --no-cache --build-arg "SOURCE_DATE_EPOCH=$epoch" --target distribution -t "moonoperator:rebuild-v$RELEASE_VERSION" .
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "MOON_TOOLCHAIN_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Load the public image and compare the two images
        run: |
          cd "$RUNNER_TEMP/downloads"
          if docker image inspect "moonoperator:$RELEASE_VERSION" >/dev/null 2>&1; then exit 1; fi
          docker load -i "moonoperator-v$RELEASE_VERSION-linux-amd64-image.tar.gz"
          compare="$RUNNER_TEMP/compare"
          mkdir -p "$compare/public" "$compare/rebuilt"
          for entry in "public:$RELEASE_VERSION" "rebuilt:rebuild-v$RELEASE_VERSION"; do
            label=${entry%%:*}
            image="moonoperator:${entry#*:}"
            docker image inspect "$image" | jq -e '.[0] | select(.Os == "linux" and .Architecture == "amd64" and .Config.User == "65532:65532" and .Config.Entrypoint == ["/usr/local/bin/moonoperator"] and (.RootFS.Layers | length) == 1) | {image_id:.Id,created:.Created,filesystem_layers:.RootFS.Layers}' > "$compare/$label/image.json"
            container=$(docker create "$image")
            docker cp "$container:/usr/local/bin/moonoperator" "$compare/$label/moonoperator"
            docker cp "$container:/usr/share/doc/moonoperator/binary-source-packages.tsv" "$compare/$label/packages.tsv"
            docker rm "$container"
          done
          diff -u "$compare/public/packages.tsv" "$compare/rebuilt/packages.tsv"
          test "$(jq -r .image_id release-manifest.json)" = "$(jq -r .image_id "$compare/public/image.json")"
          test "$(jq -r .executable_sha256 release-manifest.json)" = "$(sha256sum "$compare/public/moonoperator" | cut -d ' ' -f 1)"
          test "$(cut -d ' ' -f 1 "$RUNNER_TEMP/report/rebuilt-binary.txt")" = "$(sha256sum "$compare/rebuilt/moonoperator" | cut -d ' ' -f 1)"
          {
            jq -r .image_id "$compare/public/image.json" "$compare/rebuilt/image.json"
            sha256sum "$compare/public/moonoperator" "$compare/rebuilt/moonoperator"
          } | tee "$RUNNER_TEMP/report/image-comparison.txt"
          cp "$compare/public/image.json" "$RUNNER_TEMP/report/public-image.json"
          cp "$compare/rebuilt/image.json" "$RUNNER_TEMP/report/rebuilt-image.json"
          cp "$compare/public/packages.tsv" "$RUNNER_TEMP/report/"
          cmp "$compare/public/image.json" "$compare/rebuilt/image.json"
          cmp "$compare/public/moonoperator" "$compare/rebuilt/moonoperator"
          test "$(jq -c .filesystem_layers release-manifest.json)" = "$(jq -c .filesystem_layers "$compare/public/image.json")"
          while IFS=$'\t' read -r binary version source source_version architecture; do
            jq -e --arg src "$source" --arg ver "$source_version" 'any(.source_packages[]; .source == $src and .version == $ver)' "$RUNNER_TEMP/system/source-manifest.json"
          done < "$compare/public/packages.tsv"
      - name: Start a clean Kubernetes cluster
        run: |
          curl --retry 3 --retry-all-errors --max-time 120 -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind || curl --retry 2 --max-time 120 -fsSL -H 'Accept: application/octet-stream' https://api.github.com/repos/kubernetes-sigs/kind/releases/assets/531396433 -o /tmp/kind
          sha256sum --check "$RUNNER_TEMP/source/MoonOperator/tools/kind-linux.sha256"
          chmod +x /tmp/kind
          /tmp/kind create cluster --name moonoperator-release --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --wait 120s
          /tmp/kind load docker-image "moonoperator:$RELEASE_VERSION" --name moonoperator-release
          kubectl --context kind-moonoperator-release version -o json | tee "$RUNNER_TEMP/report/kubernetes.json"
          jq -e '.serverVersion.gitVersion == "v1.37.0"' "$RUNNER_TEMP/report/kubernetes.json"
      - name: Deploy the public image and check reconciliation
        run: |
          moon run .acceptance-harness/scripts/published-release-check.mbtx -- "$GITHUB_WORKSPACE" "$RUNNER_TEMP/report" "moonoperator:$RELEASE_VERSION"
      - name: Remove the disposable cluster
        if: always()
        run: |
          if test -x /tmp/kind; then /tmp/kind delete cluster --name moonoperator-release; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-release-acceptance
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn

name: Experimental WASM host probe
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  wasm-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install checksum-verified MoonBit SDK
        run: |
          curl -fsSL 'https://cli.moonbitlang.com/binaries/0.10.17%2Bd971670cd/moonbit-linux-x86_64.tar.gz' -o /tmp/moonbit.tar.gz
          curl -fsSL 'https://cli.moonbitlang.com/cores/core-0.10.17%2Bd971670cd.tar.gz' -o /tmp/core.tar.gz
          sha256sum --check tools/moonbit-linux.sha256
          mkdir -p "$HOME/.moon/lib"
          tar -xzf /tmp/moonbit.tar.gz -C "$HOME/.moon"
          tar -xzf /tmp/core.tar.gz -C "$HOME/.moon/lib"
          export PATH="$HOME/.moon/bin:$PATH"
          moon -C "$HOME/.moon/lib/core" bundle --warn-list -a --all
      - run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update
      - run: sudo apt-get install -y libssl-dev
      - run: moon update
      - run: curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/wasmtime-v50.0.1-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
      - run: sha256sum --check tools/wasmtime-linux.sha256
      - run: tar -xJf /tmp/wasmtime.tar.xz -C /tmp
      - run: moon build examples/wasm_validator --target wasm
      - run: moon run tests/wasm_host --target native -- /tmp/wasmtime-v50.0.1-x86_64-linux/wasmtime _build/wasm/debug/build/examples/wasm_validator/wasm_validator.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-host-evidence
          path: wasm-host-report.json

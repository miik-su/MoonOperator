name: Pinned MoonBit Linux toolchain
description: Verify the pinned SDK and core archives and install native dependencies
inputs:
  scalar-utf:
    description: Use an isolated SDK with the optional SIMD UTF objects omitted
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SCALAR_UTF: ${{ inputs.scalar-utf }}
      run: |
        curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsSL 'https://cli.moonbitlang.com/binaries/0.10.17%2Bd971670cd/moonbit-linux-x86_64.tar.gz' -o /tmp/moonbit.tar.gz
        curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsSL 'https://cli.moonbitlang.com/cores/core-0.10.17%2Bd971670cd.tar.gz' -o /tmp/core.tar.gz
        sha256sum --check tools/moonbit-linux.sha256
        sdk="$HOME/.moon"
        sdk_options=()
        if [ "$SCALAR_UTF" = 'true' ]; then
          # Jobs use fresh runners. Keep this path stable for runtime debug info.
          sdk="$RUNNER_TEMP/moonoperator-scalar-sdk"
          mkdir "$sdk"
          sdk_options=(--exclude=./lib/simdutf.o --exclude=./lib/moonbit_simdutf.o)
        fi
        mkdir -p "$sdk/lib"
        tar "${sdk_options[@]}" -xzf /tmp/moonbit.tar.gz -C "$sdk"
        tar -xzf /tmp/core.tar.gz -C "$sdk/lib"
        if [ "$SCALAR_UTF" = 'true' ]; then
          test ! -e "$sdk/lib/simdutf.o"
          test ! -e "$sdk/lib/moonbit_simdutf.o"
        fi
        chmod +x "$sdk/bin/"* "$sdk/bin/internal/tcc"
        export PATH="$sdk/bin:$PATH" MOON_TOOLCHAIN_ROOT="$sdk"
        moon -C "$sdk/lib/core" bundle --warn-list -a --all
        echo "$sdk/bin" >> "$GITHUB_PATH"
        echo "MOON_TOOLCHAIN_ROOT=$sdk" >> "$GITHUB_ENV"
    - shell: bash
      run: sudo apt-get update
    - shell: bash
      run: sudo apt-get install -y libssl-dev unzip
    - shell: bash
      run: moon update

name: Focused native checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan fetched Git history for credentials
        run: |
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz || curl --retry 2 --connect-timeout 20 --max-time 120 -fsSL -H 'Accept: application/octet-stream' https://api.github.com/repos/gitleaks/gitleaks/releases/assets/378332058 -o /tmp/gitleaks.tar.gz
          sha256sum --check tools/gitleaks-linux.sha256
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          /tmp/gitleaks/gitleaks git --redact --log-opts=--all .
      - name: Install checksum-verified MoonBit SDK
        run: |
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsSL 'https://cli.moonbitlang.com/binaries/0.10.17%2Bd971670cd/moonbit-linux-x86_64.tar.gz' -o /tmp/moonbit.tar.gz
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsSL 'https://cli.moonbitlang.com/cores/core-0.10.17%2Bd971670cd.tar.gz' -o /tmp/core.tar.gz
          sha256sum --check tools/moonbit-linux.sha256
          mkdir -p "$HOME/.moon/lib"
          tar -xzf /tmp/moonbit.tar.gz -C "$HOME/.moon"
          tar -xzf /tmp/core.tar.gz -C "$HOME/.moon/lib"
          chmod +x "$HOME/.moon/bin/"* "$HOME/.moon/bin/internal/tcc"
          export PATH="$HOME/.moon/bin:$PATH"
          moon -C "$HOME/.moon/lib/core" bundle --warn-list -a --all
      - run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update
      - run: sudo apt-get install -y libssl-dev
      - run: moon version --all
      - run: moon update
      - run: moon check --target native
      - run: moon fmt --check
      - run: moon info --target native
      - run: git diff --exit-code -- '*.mbti'
      - run: moon test queue/queue_test.mbt transport/http_test.mbt watch/watch_test.mbt examples/moonapp/operator_test.mbt --target native
      - run: moon test queue/capacity_test.mbt controller/concurrency_test.mbt controller/finalizer_test.mbt runtime/backpressure_test.mbt runtime/recovery_test.mbt transport/fault_test.mbt --target native
      - run: moon test client/typed_list_test.mbt transport/kubeconfig_test.mbt transport/cancellation_test.mbt --target native
      - run: moon test core/budget_test.mbt cache/budget_test.mbt transport/origin_test.mbt controller/deadline_test.mbt watch/adversarial_test.mbt --target native
      - run: moon test core/redaction_test.mbt core/ownership_test.mbt core/validation_test.mbt controller/finalizer_test.mbt examples/moonapp/ownership_test.mbt watch/version_test.mbt runtime/capacity_test.mbt transport/files_wbtest.mbt rbac/rbac_test.mbt client/budget_test.mbt --target native
      - run: moon test core/utc_test.mbt examples/moonapp/status_test.mbt queue/heap_test.mbt queue/timers_wbtest.mbt transport/retry_after_test.mbt crd/versions_test.mbt --target native
      - run: moon test observability/admission_wbtest.mbt observability/progress_test.mbt --target native
      - run: moon run benchmarks/queue_scale --target native --release
      - name: Collect bounded benchmark and load observations
        run: moon run scripts/collect-observations.mbtx -- ci-evidence
      - run: moon run scripts/sbom.mbtx -- source-sbom.json
      - run: moon run scripts/advisories.mbtx
      - run: git diff --no-index -- docs/evidence/source-sbom.json source-sbom.json
      - name: Display test observations
        if: always()
        run: moon run scripts/report-summary.mbtx -- native '${{ job.status }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-observations
          path: |
            ci-evidence/
            test-results-summary.md
            queue-scale-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-dependency-inventory
          path: |
            source-sbom.json
            advisory-report.json
